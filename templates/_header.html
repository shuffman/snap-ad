  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="wordmark">ad<span>buddy</span></a>
      <div class="header-actions">
        {% if show_new_listing %}
        <a href="/" class="header-link">New listing</a>
        {% endif %}
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="Toggle color theme">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
          </svg>
        </button>
      </div>
    </div>
  </header>
  <script>
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const current =
        root.dataset.theme ??
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const next = current === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('adb-theme', next); } catch (e) {}
    });
  </script>
